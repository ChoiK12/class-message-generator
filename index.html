<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fa">
  <title>반톡 공지 생성기</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- 헤더 -->
  <header>
    <h1>📋 반톡 공지 생성기</h1>
    <p id="schoolDisplay">학교 정보를 설정해주세요.</p>
  </header>


  <!-- 공지사항 -->
  <section class="card">

    <h2>공지사항📣</h2>

    <textarea
      id="notice"
      placeholder="공지사항을 입력하세요&#10;예: 수요일 모의고사"
    ></textarea>

    <button id="loadBtn" class="main-btn">
      정보 불러오기
    </button>

    <p id="status"></p>

  </section>


  <!-- 결과 -->
  <section class="card">

    <div class="result-header">

      <h2>완성된 문구</h2>

      <button id="copyBtn" class="copy-btn">
        📋 복사
      </button>

    </div>

    <pre id="result">공지사항📣
- 

내일 시간표
학교 정보를 먼저 설정해주세요.

내일 급식🍚
학교 정보를 먼저 설정해주세요.</pre>

  </section>


  <!-- 학교 정보 변경 -->
  <button
    id="schoolSettingBtn"
    class="school-setting-btn"
  >
    🏫 학교 정보 변경 및 설정
  </button>


  <!-- 제작자 정보 -->
  <footer>

    <div class="footer-title">
      📋 반톡 공지 생성기
    </div>

    <div>
      제작: 최강임 (@gangim_pic)
    </div>

    <div>
      NEIS Open API를 활용하여 학교 시간표 및 급식 정보를 제공합니다.<br>
      실제 학교 정보와 일부 차이가 있을 수 있습니다.
    </div>

    <div>
      버그 및 문의: Instagram @gangim_pic DM
    </div>

  </footer>

</div>


<!-- ========================================
     학교 설정 팝업
     ======================================== -->

<div id="schoolModal" class="modal">

  <div class="modal-content">

    <div class="modal-header">

      <h2>🏫 학교 정보 변경 및 설정</h2>

      <button
        id="closeModalBtn"
        class="close-btn"
      >
        ×
      </button>

    </div>


    <!-- 학교 검색 -->

    <label>학교</label>

    <div class="school-search">

      <input
        type="text"
        id="schoolSearchInput"
        placeholder="학교 이름을 입력하세요"
      >

      <button id="schoolSearchBtn">
        🔍
      </button>

    </div>

    <div
      id="schoolSearchStatus"
      class="search-status"
    ></div>

    <div
      id="schoolResults"
      class="school-results"
    ></div>


    <!-- 선택된 학교 -->

    <div
      id="selectedSchool"
      class="selected-school"
    >
      학교를 선택해주세요.
    </div>


    <!-- 학년 -->

    <label>학년</label>

    <select id="gradeSelect">

      <option value="1">1학년</option>
      <option value="2">2학년</option>
      <option value="3">3학년</option>

    </select>


    <!-- 반 -->

    <label>반</label>

    <select id="classSelect">

      <option value="1">1반</option>
      <option value="2">2반</option>
      <option value="3">3반</option>
      <option value="4">4반</option>
      <option value="5">5반</option>
      <option value="6">6반</option>
      <option value="7">7반</option>
      <option value="8">8반</option>
      <option value="9">9반</option>
      <option value="10">10반</option>
      <option value="11">11반</option>
      <option value="12">12반</option>

    </select>


    <!-- 급식 -->

    <label>급식 표시</label>

    <div class="meal-checkboxes">

      <label class="meal-checkbox">
        <input
          type="checkbox"
          id="breakfastCheck"
          value="1"
        >
        <span>조식</span>
      </label>

      <label class="meal-checkbox">
        <input
          type="checkbox"
          id="lunchCheck"
          value="2"
          checked
        >
        <span>중식</span>
      </label>

      <label class="meal-checkbox">
        <input
          type="checkbox"
          id="dinnerCheck"
          value="3"
        >
        <span>석식</span>
      </label>

    </div>


<!-- 정보 날짜 -->

<label>정보 날짜</label>

<div class="date-checkboxes">

  <label class="date-checkbox">
    <input
      type="radio"
      name="infoDate"
      id="todayCheck"
      value="today"
    >
    <span>오늘</span>
  </label>

  <label class="date-checkbox">
    <input
      type="radio"
      name="infoDate"
      id="tomorrowCheck"
      value="tomorrow"
      checked
    >
    <span>내일</span>
  </label>

</div>


    <!-- 저장 -->

    <button
      id="saveSchoolBtn"
      class="save-btn"
    >
      저장하기
    </button>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
